<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPGdle</title>
    <style>
        :root {
            --cor-fundo: #121212;
            --cor-texto: #e1e1e1;
            --cor-caixa: #2c2c2c;
            --cor-borda: #444;
            --cor-verde: #4CAF50;
            --cor-amarelo: #FFC107;
            --cor-vermelho: #F44336;
            --cor-sombra: #0000004d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--cor-amarelo);
            text-shadow: 1px 1px 2px var(--cor-sombra);
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #input-section {
            display: flex;
            gap: 10px;
        }

        #guess-input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            background-color: var(--cor-caixa);
            color: var(--cor-texto);
            border: 1px solid var(--cor-borda);
            border-radius: 5px;
        }

        #guess-button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: var(--cor-amarelo);
            color: var(--cor-fundo);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #guess-button:hover {
            background-color: #ffd54f;
        }

        #results-header,
        .result-row {
            display: grid;
            grid-template-columns: 50px 2fr 1fr 1fr 1fr 1fr 2fr;
            text-align: center;
            gap: 10px;
            font-weight: bold;
            align-items: center;
        }

        .header-cell {
            padding: 5px;
        }

        .result-row {
            background-color: var(--cor-caixa);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--cor-borda);
        }

        .result-cell {
            padding: 10px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 40px;
        }

        .result-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--cor-borda);
        }

        .result-cell.nome-personagem {
            background-color: var(--cor-borda);
            font-weight: bold;
        }

        .correct {
            background-color: var(--cor-verde);
            color: white;
        }

        .partial {
            background-color: var(--cor-amarelo);
            color: var(--cor-fundo);
        }

        .incorrect {
            background-color: var(--cor-vermelho);
            color: white;
        }

        #win-message {
            margin-top: 20px;
            font-size: 1.5em;
            color: var(--cor-verde);
            text-align: center;
            font-weight: bold;
            display: none;
        }

        #results-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
        }
    </style>
</head>

<body>

    <h1>RPGdle</h1>

    <div id="game-container">
        <form id="input-section" autocomplete="off">

            <button id="guess-button" type="submit">Adivinhar</button>
        </form>
        <div id="win-message"></div>
        <div id="results-header">

        let secretCharacter = null;
        let characterNames = [];
        let attempts = 0;
        let gameOver = false;

        const guessForm = document.getElementById('input-section');
        const guessInput = document.getElementById('guess-input');
        const characterDatalist = document.getElementById('character-list');
        const resultsContainer = document.getElementById('results-container');
        const winMessage = document.getElementById('win-message');

        function initializeGame() {
            secretCharacter = characterData[Math.floor(Math.random() * characterData.length)];
            characterNames = characterData.map(char => char.nome);
            characterDatalist.innerHTML = characterNames.map(name => `<option value="${name}"></option>`).join('');
            console.log("Personagem secreto (para testes):", secretCharacter.nome);
        }

        function compareArrays(guessArray, secretArray) {
            const sortedGuess = [...guessArray].sort();
            const sortedSecret = [...secretArray].sort();

            if (sortedGuess.length === sortedSecret.length && sortedGuess.every((val, index) => val === sortedSecret[index])) {
                return 'correct';
            }
            if (guessArray.some(item => secretArray.includes(item))) {
                return 'partial';
            }
            return 'incorrect';
        }

        function displayResult(guess) {
            const guessData = characterData.find(char => char.nome.toLowerCase() === guess.toLowerCase());
            if (!guessData) {
                alert("Personagem não encontrado. Por favor, escolha um da lista.");
                return;
            }

            attempts++;
            const resultRow = document.createElement('div');
            resultRow.classList.add('result-row');

            const imageContainer = document.createElement('div');
            imageContainer.classList.add('result-image-container');
            const imageCell = document.createElement('img');
            imageCell.classList.add('result-image');
            imageCell.src = guessData.imagem;
            imageCell.alt = guessData.nome;
            imageContainer.appendChild(imageCell);

            const nameCell = document.createElement('div');
            nameCell.classList.add('result-cell', 'nome-personagem');
            nameCell.textContent = guessData.nome;

            const generoCell = document.createElement('div');
            generoCell.classList.add('result-cell', (guessData.genero === secretCharacter.genero ? 'correct' : 'incorrect'));
            generoCell.textContent = guessData.genero;

            const especieCell = document.createElement('div');
            especieCell.classList.add('result-cell', (guessData.especie === secretCharacter.especie ? 'correct' : 'incorrect'));
            especieCell.textContent = guessData.especie;

            // Lógica de Classe (agora como lista)
            const classeCell = document.createElement('div');
            classeCell.classList.add('result-cell', compareArrays(guessData.classe, secretCharacter.classe));
            classeCell.textContent = guessData.classe.join(', ');

            const campanhaCell = document.createElement('div');
            campanhaCell.classList.add('result-cell', compareArrays(guessData.campanha, secretCharacter.campanha));
            campanhaCell.textContent = guessData.campanha.join(', ');

            const regiaoCell = document.createElement('div');
            regiaoCell.classList.add('result-cell', compareArrays(guessData.regiao, secretCharacter.regiao));
            regiaoCell.textContent = guessData.regiao.join(', ');

            resultRow.appendChild(imageContainer);
            resultRow.appendChild(nameCell);
            resultRow.appendChild(generoCell);
            resultRow.appendChild(especieCell);
            resultRow.appendChild(classeCell);
            resultRow.appendChild(campanhaCell);
            resultRow.appendChild(regiaoCell);

            resultsContainer.appendChild(resultRow);

            if (guessData.nome === secretCharacter.nome) {
                gameOver = true;
                winMessage.textContent = `Parabéns! Você acertou em ${attempts} tentativa(s)!`;
                winMessage.style.display = 'block';
                guessInput.disabled = true;
                document.getElementById('guess-button').disabled = true;
            }
        }

        guessForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (gameOver) return;
            const userGuess = guessInput.value.trim();
            if (userGuess && characterNames.includes(userGuess)) {
                displayResult(userGuess);
                guessInput.value = '';
            } else if (userGuess) {
                alert("Personagem inválido. Por favor, escolha um nome da lista de sugestões.");
            }
        });

        window.onload = initializeGame;
    </script>
